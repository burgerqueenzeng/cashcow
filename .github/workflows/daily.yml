name: Daily Market Review

on:
  schedule:
    # 9:30 PM UTC = 4:30 PM ET (after NYSE close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CashCow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit report
        run: |
          git config user.name "cashcow-bot"
          git config user.email "cashcow-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "report: $(date +%Y-%m-%d)"
          git push
